# Build every host on GitHub's ARM runners; on main, deploy from Tower.
#
# `build` runs on every pull request and on main. On main it also uploads
# the built systems as an artifact. `deploy` then runs on Tower's own runner,
# inside the home network, and pushes them to the Pis over the LAN.
#
# Tower's runner is on the home network, and this repo is public. Only main
# can reach it: `deploy` runs on pushes to main only, its SSH key is in the
# `production` environment, which only main can use, and workflow runs from
# outside contributors need approval first. Never approve one from a
# stranger: it would run their version of this file.
name: Build and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    outputs:
      dns1: ${{ steps.build.outputs.dns1 }}
      dns2: ${{ steps.build.outputs.dns2 }}
      kitchen-music: ${{ steps.build.outputs.kitchen-music }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No decrypted secrets in the repo
        run: |
          if git ls-files | grep -E '(^|/)[^/]*\.secret\.[^/]*$'; then
            echo "::error::A decrypted *.secret.* file is committed."; exit 1
          fi
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      # Anything cache.nixos.org doesn't have is built here, and some of it
      # is slow: nixpkgs 26.05's Raspberry Pi kernel isn't on cache.nixos.org
      # and takes about 85 minutes to compile. So keep what we build in
      # GitHub's Actions cache, as a binary cache in built/, and substitute
      # from it. GitHub scopes caches by branch: main only restores what
      # main saved, so a pull request can't plant anything in a deploy.
      - name: Restore what earlier runs built
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: built
          key: built-${{ github.sha }} # never saved; restore-keys finds the newest
          restore-keys: built-

      - name: Build
        id: build
        run: |
          substituters=()
          if [ -f built/nix-cache-info ]; then
            # Unsigned, so trusted=true for this cache alone; cache.nixos.org
            # still has to be signed.
            substituters=(--option extra-substituters "file://$PWD/built?trusted=true")
          fi
          for host in dns1 dns2 kitchen-music; do
            path=$(nix build --no-link --print-out-paths "${substituters[@]}" \
              ".#nixosConfigurations.rainnworks-$host.config.system.build.toplevel")
            echo "$host=$path" >> "$GITHUB_OUTPUT"
            echo "$host: $path"
          done

      # The paths in the three systems that aren't from cache.nixos.org and
      # are at least 1 MiB: the kernel and its modules, initrds, spotifyd,
      # hwdb. The rest are config files that rebuild in seconds. Skip
      # system-path too: it's a symlink farm that rebuilds in seconds, and a
      # binary cache must hold each path's full closure, so it would drag in
      # every package (830 MB instead of the kernel's share). Saved again
      # only when the list changes.
      - name: Collect what cache.nixos.org doesn't have
        id: collect
        env:
          RESTORED: ${{ steps.restore.outputs.cache-matched-key }}
          SYSTEMS: >-
            ${{ steps.build.outputs.dns1 }}
            ${{ steps.build.outputs.dns2 }}
            ${{ steps.build.outputs.kitchen-music }}
        run: |
          list="$RUNNER_TEMP/built-paths"
          # shellcheck disable=SC2086 # SYSTEMS is a list of store paths
          nix path-info --recursive --json --json-format 2 $SYSTEMS |
            jq -r '.info | to_entries[]
              | select(.value.narSize >= 1048576)
              | select(.key | endswith("-system-path") | not)
              | select(all(.value.signatures[]; startswith("cache.nixos.org-1:") | not))
              | "/nix/store/\(.key)"' | sort > "$list"
          cat "$list"
          [ -s "$list" ] || exit 0
          key="built-$(sha256sum < "$list" | cut -c1-32)"
          if [ "$key" = "$RESTORED" ]; then
            echo "Unchanged since $RESTORED."
            exit 0
          fi
          rm -rf built
          xargs nix copy --to "file://$PWD/built?compression=zstd" < "$list"
          du -sh built
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Save it for later runs
        if: steps.collect.outputs.key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: built
          key: ${{ steps.collect.outputs.key }}

      - name: Pack the systems for Tower
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          nix copy --to "file://$PWD/systems?compression=zstd" \
            ${{ steps.build.outputs.dns1 }} \
            ${{ steps.build.outputs.dns2 }} \
            ${{ steps.build.outputs.kitchen-music }}
          du -sh systems

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: systems
          path: systems
          retention-days: 3
          compression-level: 0 # already zstd

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, tower]
    environment: production
    # scripts/ci-deploy.sh limits each copy and remote command; this is the
    # backstop, so a stuck run can't hold the deploy lock for GitHub's 6 hours.
    timeout-minutes: 90
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: systems
          path: systems

      - name: SSH key for the Pis
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          cat > ~/.ssh/config <<EOF
          Host 192.168.96.*
            User tom
            IdentityFile ~/.ssh/deploy
            IdentitiesOnly yes
            UserKnownHostsFile $PWD/ci/known_hosts
            StrictHostKeyChecking yes
            ConnectTimeout 15
          EOF

      - name: Deploy, one Pi at a time
        env:
          SYSTEMS_STORE: file://${{ github.workspace }}/systems
        run: |
          export NIX_SSHOPTS="-F $HOME/.ssh/config"
          scripts/ci-deploy.sh \
            "dns2=${{ needs.build.outputs.dns2 }}" \
            "dns1=${{ needs.build.outputs.dns1 }}" \
            "kitchen-music=${{ needs.build.outputs.kitchen-music }}"

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy
