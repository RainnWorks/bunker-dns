# Build every host on GitHub's ARM runners; on main, deploy from Tower.
#
# `build` runs on every pull request and on main. On main it also uploads
# the built systems as an artifact. `deploy` then runs on Tower's own runner,
# inside the home network, and pushes them to the Pis over the LAN.
#
# Tower's runner is on the home network, and this repo is public. Only main
# can reach it: `deploy` runs on pushes to main only, its SSH key is in the
# `production` environment, which only main can use, and workflow runs from
# outside contributors need approval first. Never approve one from a
# stranger: it would run their version of this file.
name: Build and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    outputs:
      dns1: ${{ steps.build.outputs.dns1 }}
      dns2: ${{ steps.build.outputs.dns2 }}
      kitchen-music: ${{ steps.build.outputs.kitchen-music }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No decrypted secrets in the repo
        run: |
          if git ls-files | grep -E '(^|/)[^/]*\.secret\.[^/]*$'; then
            echo "::error::A decrypted *.secret.* file is committed."; exit 1
          fi
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: Build
        id: build
        run: |
          for host in dns1 dns2 kitchen-music; do
            path=$(nix build --no-link --print-out-paths \
              ".#nixosConfigurations.rainnworks-$host.config.system.build.toplevel")
            echo "$host=$path" >> "$GITHUB_OUTPUT"
            echo "$host: $path"
          done

      - name: Pack the systems for Tower
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          nix copy --to "file://$PWD/systems?compression=zstd" \
            ${{ steps.build.outputs.dns1 }} \
            ${{ steps.build.outputs.dns2 }} \
            ${{ steps.build.outputs.kitchen-music }}
          du -sh systems

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: systems
          path: systems
          retention-days: 3
          compression-level: 0 # already zstd

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, tower]
    environment: production
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: systems
          path: systems

      - name: SSH key for the Pis
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          cat > ~/.ssh/config <<EOF
          Host 192.168.96.*
            User tom
            IdentityFile ~/.ssh/deploy
            IdentitiesOnly yes
            UserKnownHostsFile $PWD/ci/known_hosts
            StrictHostKeyChecking yes
            ConnectTimeout 15
          EOF

      - name: Deploy, one Pi at a time
        env:
          SYSTEMS_STORE: file://${{ github.workspace }}/systems
        run: |
          export NIX_SSHOPTS="-F $HOME/.ssh/config"
          scripts/ci-deploy.sh \
            "dns2=${{ needs.build.outputs.dns2 }}" \
            "dns1=${{ needs.build.outputs.dns1 }}" \
            "kitchen-music=${{ needs.build.outputs.kitchen-music }}"

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy
