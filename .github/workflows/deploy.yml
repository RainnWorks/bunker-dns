# Build every host on each pull request; build and deploy on main.
#
# The deploy job reaches the Pis through Tower's WireGuard, as peer
# 10.253.0.6, which Tower limits to SSH on the three Pis. Its only GitHub
# secret is SOPS_AGE_KEY, in the `production` environment, which only main
# can use: pull requests, and forks above all, never see it. Everything else
# it needs is in secrets/deploy.sops.env, encrypted to that key.
#
# This repo is public, so these logs are too. Never print a decrypted value.
name: Build and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No decrypted secrets in the repo
        run: |
          if git ls-files | grep -E '(^|/)[^/]*\.secret\.[^/]*$'; then
            echo "::error::A decrypted *.secret.* file is committed."; exit 1
          fi
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Build
        run: |
          nix build --no-link \
            .#nixosConfigurations.rainnworks-dns1.config.system.build.toplevel \
            .#nixosConfigurations.rainnworks-dns2.config.system.build.toplevel \
            .#nixosConfigurations.rainnworks-kitchen-music.config.system.build.toplevel

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    environment: production
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: Build
        id: build
        run: |
          for host in dns1 dns2 kitchen-music; do
            path=$(nix build --no-link --print-out-paths \
              ".#nixosConfigurations.rainnworks-$host.config.system.build.toplevel")
            echo "$host=$path" >> "$GITHUB_OUTPUT"
          done

      - name: Decrypt deploy secrets
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          umask 077
          nix shell --inputs-from . nixpkgs#sops -c sops --decrypt secrets/deploy.sops.env > deploy.secret.env
          while IFS='=' read -r key value; do
            [ -n "$key" ] && echo "::add-mask::$value"
          done < deploy.secret.env

      - name: Connect to Tower
        run: |
          set -a; . ./deploy.secret.env; set +a
          sudo apt-get install -y -qq wireguard-tools >/dev/null
          sudo install -m 600 /dev/null /etc/wireguard/wg0.conf
          sudo tee /etc/wireguard/wg0.conf >/dev/null <<EOF
          [Interface]
          PrivateKey = $WG_PRIVATE_KEY
          Address = $WG_ADDRESS

          [Peer]
          PublicKey = $WG_SERVER_PUBLIC_KEY
          Endpoint = $WG_ENDPOINT
          AllowedIPs = 192.168.96.45/32, 192.168.96.60/32, 192.168.96.157/32
          PersistentKeepalive = 25
          EOF
          sudo wg-quick up wg0

          install -d -m 700 ~/.ssh
          printf '%s' "$DEPLOY_SSH_KEY_B64" | base64 -d > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          cat > ~/.ssh/config <<EOF
          Host 192.168.96.*
            User tom
            IdentityFile ~/.ssh/deploy
            IdentitiesOnly yes
            UserKnownHostsFile $PWD/ci/known_hosts
            StrictHostKeyChecking yes
            ConnectTimeout 15
          EOF

      - name: Deploy, one Pi at a time
        env:
          NIX_SSHOPTS: -F /home/runner/.ssh/config
        run: |
          scripts/ci-deploy.sh \
            "dns2=${{ steps.build.outputs.dns2 }}" \
            "dns1=${{ steps.build.outputs.dns1 }}" \
            "kitchen-music=${{ steps.build.outputs.kitchen-music }}"

      - name: Disconnect
        if: always()
        run: |
          sudo wg-quick down wg0 2>/dev/null || true
          rm -f deploy.secret.env ~/.ssh/deploy
